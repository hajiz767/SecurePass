<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SecurePass Manager</title>
    <style>
        /* General Page Layout */
        body { font-family: sans-serif; background: #f4f4f4; text-align: center; padding: 50px; }

        /* The Dashboard Container */
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }

        h1 { color: #2c3e50; }

        /* Dynamic message from Java Controller */
        .message { color: #27ae60; font-weight: bold; margin-bottom: 20px; }

        /* Styling the Password Input Field */
        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            display: block; /* Ensures the button moves to the next line */
            margin-left: auto;
            margin-right: auto;
        }

        /* Styling the Submit Button */
        button {
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        /* Hover effect for better User Experience (UX) */
        button:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>SecurePass Dashboard</h1>
    <p class="message" th:text="${message}">Initializing...</p>

    <form action="/" method="get">
        <input type="password" name="pwd" placeholder="Enter password to test..." required>
        <button type="submit">Scan for Vulnerabilities</button>
    </form>

    <div th:if="${strength}" style="margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
        <p><strong>Complexity:</strong> <span th:text="${strength}"></span></p>
        <p><strong>SHA-1 Hash:</strong> <code th:text="${hash}" style="font-size: 0.8em; color: #666;"></code></p>
        <hr>
        <p><strong>Status:</strong>
            <span th:text="${status}" th:style="${status == '⚠️ BREACHED' ? 'color:red; font-weight:bold;' : 'color:green; font-weight:bold;'}"></span>
        </p>
    </div>
</div>
</body>
</html>
